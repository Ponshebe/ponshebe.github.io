name: 投稿の声かけ

# オーナーが忘れないよう、Discord に声をかける（PC・AI 不要）。2026-11-24 M 更新
on:
  schedule:
    - cron: '1 7 * * 5'    # 金曜 16:01（日本時間）来週の投稿の準備
    - cron: '7 5 * * 1'    # 月曜 14:07 投稿案の確認と OK
    - cron: '7 3 15 * *'   # 15日 12:07 来月のカレンダーの告知
    - cron: '7 3 19 * *'   # 19日 12:07 臨時の休みの締め切り
    - cron: '37 4 20 * *'  # 20日 13:37 再来月のカレンダーがページに載った知らせ
  workflow_dispatch:
    inputs:
      which:
        description: '試しに送る声かけ（fri / mon / d15 / d19 / d20）'
        required: true
        default: 'fri'

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Discord に送る
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          SCHEDULE: ${{ github.event.schedule }}
          WHICH: ${{ github.event.inputs.which }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          m = {"1 7 * * 5": "fri", "7 5 * * 1": "mon",
               "7 3 15 * *": "d15", "7 3 19 * *": "d19", "37 4 20 * *": "d20"}
          k = os.environ.get("WHICH") or m.get(os.environ.get("SCHEDULE", ""), "")
          text = {
              "fri": "【来週の投稿の準備・金曜】来週の投稿に入れたい新入荷の日本酒・催しがあれば、月曜の12時までにMのチャットへひと言。使ってほしい写真は「投稿用写真」のフォルダへ。月曜12時半から、Mが直近の分と、その後5回分の投稿案を作ります。",
              "mon": "【投稿案の確認・月曜】Mの投稿案（共有フォルダ MEO_SEO_HP の「投稿案」）を確かめて、Mのチャットに「OK」と送ってください。直したい所は番号と「ここをこう」だけで大丈夫です。OKのあと、Mが Google・Instagram・Facebook・HP に予約を入れます。案が無ければ、チャットに「今週の投稿」と送ってください。",
              "d15": "【カレンダー・15日】今日から後の最初の投稿で、来月の営業日カレンダーを告知します。Mが文と画像を入れます。",
              "d19": "【締め切り・19日】再来月の臨時の休み・振替営業があれば、今日中にMのチャットへ。明日20日に再来月のカレンダーを自動で作ります。",
              "d20": "【カレンダー・20日】再来月のカレンダーを作り、営業日のページに載せました（届いていなければMへ）。SNS・ブログでの告知は、来月15日以降の最初の投稿です。",
          }.get(k)
          if not text:
              print("該当なし:", os.environ.get("SCHEDULE"))
              raise SystemExit(0)
          hook = os.environ.get("DISCORD_WEBHOOK")
          if not hook:
              print("DISCORD_WEBHOOK がありません")
              raise SystemExit(1)
          req = urllib.request.Request(hook, data=json.dumps({"content": text}).encode(),
                                       headers={"Content-Type": "application/json", "User-Agent": "ponshebe-reminder"})
          print("送信:", urllib.request.urlopen(req, timeout=30).status)
          PY
