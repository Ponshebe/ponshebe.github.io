name: 投稿の声かけ

# オーナーが忘れないよう、Discord に声をかける（PC・AI 不要）。2026-11-23 M
on:
  schedule:
    - cron: '7 3 * * 4'    # 木曜 12:07（日本時間）新入荷・催しの知らせ（金曜の朝に M が投稿案を作るため）
    - cron: '7 1 * * 6'    # 土曜 10:07 確認の日（水曜の投稿の4日前）
    - cron: '7 2 * * 3'    # 水曜 11:07 投稿の日
    - cron: '7 3 19 * *'   # 19日 12:07 臨時の休みの締め切り
    - cron: '7 3 15 * *'   # 15日 12:07 来月のカレンダーの告知
    - cron: '37 4 20 * *'  # 20日 13:37 再来月のカレンダーがページに載った知らせ
  workflow_dispatch:
    inputs:
      which:
        description: '試しに送る声かけ（fri / sat / wed / d15 / d19 / d20）'
        required: true
        default: 'sat'

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Discord に送る
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
          SCHEDULE: ${{ github.event.schedule }}
          WHICH: ${{ github.event.inputs.which }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          m = {"7 3 * * 4": "fri", "7 1 * * 6": "sat", "7 2 * * 3": "wed",
               "7 3 15 * *": "d15", "7 3 19 * *": "d19", "37 4 20 * *": "d20"}
          k = os.environ.get("WHICH") or m.get(os.environ.get("SCHEDULE", ""), "")
          text = {
              "fri": "【投稿の準備・木曜】来週水曜の投稿に入れたい新入荷の日本酒・催しがあれば、今日中にMのチャットへひと言。明日（金曜）の朝、Mが投稿案を作ります。無ければ何もしなくて大丈夫です。",
              "sat": "【確認の日・土曜】水曜の投稿案（Google・Instagram・HP）を確かめてください。案は共有フォルダ MEO_SEO_HP の「投稿案」に、金曜の朝（10時ごろ）に M が置きます（PC と Claude のアプリが開いていれば自動）。無ければ、Mのチャットに「今週の投稿」と送ってください。OKを出すと、Mが3つとも水曜12時で予約します。",
              "wed": "【投稿の日・水曜】12時の投稿は予約済みですか？ Google が予約できなかったときは、Mの文を貼って出してください（1分）。",
              "d19": "【締め切り・19日】再来月の臨時の休み・振替営業があれば、今日中にMのチャットへ。明日20日に再来月のカレンダーを自動で作ります。",
              "d15": "【カレンダー・15日】今日から後の最初の投稿で、来月の営業日カレンダーを告知します。Mが文と画像を入れます。",
              "d20": "【カレンダー・20日】再来月のカレンダーを作り、営業日のページに載せました（届いていなければMへ）。SNS・ブログでの告知は、来月15日以降の最初の投稿です。",
          }.get(k)
          if not text:
              print("該当なし:", os.environ.get("SCHEDULE"))
              raise SystemExit(0)
          hook = os.environ.get("DISCORD_WEBHOOK")
          if not hook:
              print("DISCORD_WEBHOOK がありません")
              raise SystemExit(1)
          req = urllib.request.Request(hook, data=json.dumps({"content": text}).encode(),
                                       headers={"Content-Type": "application/json", "User-Agent": "ponshebe-reminder"})
          print("送信:", urllib.request.urlopen(req, timeout=30).status)
          PY
